name: "[TEMP] Validação cartões de resumo (Tendência dos módulos)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Rodar pipeline
        run: |
          python gen_data.py
          python build_dash.py

      - name: Amostra do resumo_atual (todos os módulos)
        run: |
          python3 -c "
          import json
          d=json.load(open('dash_data.json'))
          ma=d['mod_ano_a_ano']
          print('mes_corrente_ym:', ma['mes_corrente_ym'])
          print('ordem (por volume):', ma['ordem'])
          print('pequenos (baixo volume):', ma['pequenos'])
          print()
          print(json.dumps(ma['resumo_atual'], ensure_ascii=False, indent=1))
          "
