name: "[TEMP] Validação Esforço por módulo — Mês/Acumulado"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Rodar pipeline
        run: |
          python gen_data.py
          python build_dash.py

      - name: Amostra Esforço por módulo — Mês x Acumulado (últimos 3 meses)
        run: |
          python3 -c "
          import json
          d=json.load(open('dash_data.json'))
          mes=d['esforco_modulo_por_mes']
          acum=d['esforco_modulo_acumulado_por_mes']
          meses=sorted(mes.keys())[-3:]
          for m in meses:
              print(f'--- {m} ---')
              print('  Mês      :', mes[m][:5])
              print('  Acumulado:', acum[m][:5])
          # sanidade: acumulado do ultimo mes tem que ser >= mes isolado pra cada modulo em comum
          ok=True
          m=meses[-1]
          hm={r[\"mod\"]:r[\"horas\"] for r in mes[m]}
          ha={r[\"mod\"]:r[\"horas\"] for r in acum[m]}
          for mod,h in hm.items():
              if mod in ha and ha[mod] < h - 0.01:
                  print(f'!!! INCONSISTENTE: {mod} mês={h} > acumulado={ha[mod]}')
                  ok=False
          print('SANIDADE (acumulado >= mês por módulo):', 'OK' if ok else 'FALHOU')
          "
