name: "[TEMP] Verifica se o gráfico Bugs criados — ano a ano está no HTML publicado"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados
        run: python gen_data.py

      - name: Gerar o dashboard
        run: python build_dash.py

      - name: Proteger com login e montar publicação
        run: python inject_login.py

      - name: Checagem 1 — dado novo presente em dash_data.json
        run: |
          python3 -c "
          import json
          d = json.load(open('dash_data.json'))
          ok = 'bugs_criados_ano_a_ano' in d
          print('bugs_criados_ano_a_ano em dash_data.json?', ok)
          if ok:
              A = d['bugs_criados_ano_a_ano']
              print('anos:', A['anos'])
              print('meses:', A['meses'])
              for ano in A['anos']:
                  print(f'  {ano}:', A['series'][ano])
          "

      - name: Checagem 2 — HTML do dashboard (não publicado) tem o painel
        run: |
          grep -c "Bugs criados" dashboard_setor.html && echo "achado em dashboard_setor.html" || echo "NAO achado em dashboard_setor.html"
          grep -c "criadosAnoChart" dashboard_setor.html && echo "função presente" || echo "funcao NAO presente"

      - name: Checagem 3 — HTML FINAL publicado (o arquivo versionado que o Pages realmente serve) tem o painel
        run: |
          ls -la public/
          DASHFILE=$(ls public/dashboard_setor_*.html | head -1)
          echo "arquivo do dashboard nesta execução: $DASHFILE"
          grep -c "Bugs criados" "$DASHFILE" && echo "achado no dashboard versionado" || echo "NAO achado no dashboard versionado"
          grep -c "criadosAnoChart" "$DASHFILE" && echo "função presente" || echo "funcao NAO presente"
          echo "---"
          echo "public/index.html (login) referencia este arquivo?"
          grep -o 'dashboard_setor_[A-Za-z0-9_.-]*\.html' public/index.html | head -3
          grep -o 'dashboard_setor_[A-Za-z0-9_.-]*\.html' public/login.html | head -3

      - name: Checagem 4 — também confere o donut "Bugs em aberto por status" (painel anterior)
        run: |
          DASHFILE=$(ls public/dashboard_setor_*.html | head -1)
          grep -c "Bugs em aberto por status" "$DASHFILE" && echo "donut OK" || echo "donut NAO achado"
