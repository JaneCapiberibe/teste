name: _val_dump_dashboard_preview (temporário, não mergear)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados
        run: python gen_data.py

      - name: Gerar o dashboard
        run: python build_dash.py

      - name: Proteger com login e montar publicação
        run: python inject_login.py

      - name: Commitar dump numa branch separada (bypass de artifact storage)
        run: |
          git config user.name "claude-dump-bot"
          git config user.email "noreply@anthropic.com"
          mkdir -p /tmp/dump_output
          cp -r public /tmp/dump_output/public
          cp dashboard_setor.html /tmp/dump_output/ 2>/dev/null || true
          cp dash_data.json /tmp/dump_output/ 2>/dev/null || true
          git checkout --orphan claude/dashboard-preview-dump
          git rm -rf --cached . > /dev/null 2>&1 || true
          git clean -fd
          cp -r /tmp/dump_output/* .
          git add -A
          git commit -m "dump de dados (temporário, não mergear)"
          git push -f origin claude/dashboard-preview-dump
