name: "[TEMP] Investigação: campo 'Módulo BackOffice'"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Achar e analisar o campo "Módulo BackOffice"
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python3 -u -c "
          import sys, json, collections, unicodedata, requests
          sys.path.insert(0, '.')
          import fetch_jira as fj

          HEAD = fj._auth_headers()
          BASE = fj.BASE

          def norm_txt(s):
              s = unicodedata.normalize('NFKD', s or '').encode('ascii', 'ignore').decode()
              return s.lower()

          # ---- 1) achar o(s) campo(s) com 'modulo' no nome ----
          r = requests.get(f'{BASE}/rest/api/3/field', headers=HEAD, timeout=30)
          fields = r.json() if r.ok else []
          candidatos = [f for f in fields if 'modulo' in norm_txt(f['name'])]
          print('=== CAMPOS COM \"MODULO\" NO NOME ===')
          for f in candidatos:
              print(f\"  {f['id']} -> {f['name']!r} (custom={f.get('custom')}, schema={f.get('schema')})\")
          if not candidatos:
              print('nenhum campo encontrado com \"modulo\" no nome — parando aqui.')
              sys.exit(0)

          ids = [f['id'] for f in candidatos]

          # ---- 2) amostra completa (6 meses) só com esse(s) campo(s) + key/status/itype ----
          body = {'jql': 'project = BACKOFFICE AND created >= -180d ORDER BY created DESC',
                  'fields': ['key', 'issuetype', 'status'] + ids, 'maxResults': 100}
          issues, token = [], None
          while True:
              if token: body['nextPageToken'] = token
              r = requests.post(f'{BASE}/rest/api/3/search/jql', headers=HEAD, data=json.dumps(body), timeout=30)
              if not r.ok:
                  print('erro na busca:', r.status_code, r.text[:500]); break
              data = r.json()
              issues.extend(data.get('issues', []))
              token = data.get('nextPageToken')
              if not token: break
          print()
          print(f'=== AMOSTRA (6 meses): {len(issues)} issues ===')

          for fid in ids:
              nome = next(f['name'] for f in candidatos if f['id'] == fid)
              print()
              print(f'--- {fid} ({nome!r}) ---')
              vals = []
              for i in issues:
                  v = i['fields'].get(fid)
                  vals.append(v)
              preenchidos = [v for v in vals if v not in (None, [], '')]
              print(f'preenchido: {len(preenchidos)}/{len(vals)}')
              # normaliza pra contagem (pode ser string, dict com value/name, ou lista)
              def rotulo(v):
                  if isinstance(v, dict):
                      return v.get('value') or v.get('name') or json.dumps(v, ensure_ascii=False)[:60]
                  if isinstance(v, list):
                      return tuple(rotulo(x) for x in v)
                  return v
              c = collections.Counter(rotulo(v) for v in preenchidos)
              print('valores distintos:')
              for k, n in c.most_common(30):
                  print(f'  {k!r}: {n}')
              # exemplo bruto de um valor preenchido, pra ver o formato exato do JSON
              exemplo = next((i for i in issues if i['fields'].get(fid) not in (None, [], '')), None)
              if exemplo:
                  print('exemplo bruto (1 issue):', exemplo['key'], '->', json.dumps(exemplo['fields'][fid], ensure_ascii=False)[:400])
          "
