name: "[TEMP] Diagnóstico: criados projetados vs funil do mês"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Rodar pipeline
        run: |
          python gen_data.py
          python build_dash.py

      - name: Comparar criados projetado (Carga) vs funil do mês corrente
        run: |
          python3 -c "
          import json
          d=json.load(open('dash_data.json'))
          ma=d['mod_ano_a_ano']
          cur=ma['mes_corrente_ym']
          print('mes_corrente_ym:', cur)
          print('dias_uteis_decorridos:', d['meta']['dias_uteis_decorridos_mes'])
          print('dias_uteis_totais_mes:', d['meta']['dias_uteis_totais_mes'])
          print()
          soma_projetado=0.0
          soma_ate_agora_reconstruido=0.0
          for mod, r in ma['resumo_atual'].items():
              soma_projetado += r['criados_projetado'] or 0
              # reconstrói o valor bruto (sweep, exclui só Cancelado QA) a partir do projetado
              du=d['meta']['dias_uteis_decorridos_mes']; dt=d['meta']['dias_uteis_totais_mes']
              bruto = (r['criados_projetado'] or 0) * du / dt if dt else 0
              soma_ate_agora_reconstruido += bruto
          print('soma criados_projetado (todos os módulos, run-rate p/ o mês inteiro):', round(soma_projetado,1))
          print('soma reconstruída = criados BRUTOS até agora (sweep, exclui só Cancelado QA):', round(soma_ate_agora_reconstruido,1))
          print()
          f = d['funil_por_mes'].get(cur) or d['funil']
          print('funil (Diagnóstico do mês) para', cur, ':')
          print('  total (bugs criados, sweep_full, TODOS os tipos, INCLUI Cancelado QA, até agora):', f['total'])
          print('  descartados_qa:', f['descartados_qa'])
          print('  cancelados_dev:', f['cancelados_dev'])
          print('  dev (chegaram ao dev, líquido):', f['dev'])
          print()
          print('total - descartados_qa (aprox. sweep sem Cancelado QA, até agora):', f['total']-f['descartados_qa'])
          "
