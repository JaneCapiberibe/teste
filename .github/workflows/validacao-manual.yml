name: Validação manual (temporário)

# Workflow TEMPORÁRIO — roda fetch_jira.py + gen_data.py + build_dash.py (com os segredos do
# Jira) SEM publicar nada, só pra validar a nova fonte do gráfico "Alocação — bugs por
# responsável": agora nativa do Jira (campo assignee em sweep.json) em vez da aba "Base
# Atualmódulos" do xlsx, alinhada com a régua de "Bug por módulo" (concluído = mês da 1ª
# transição pro status, não mês de criação), e com clique-p/-abrir-no-Jira (data-keys +
# abrirCardsBar(), mesmo padrão do resto do dashboard). Confirma que 'assignee' está em
# sweep.json, que a soma de concluídos por responsável bate EXATAMENTE com d['tot_series']
# [mes]['backlog_concluidos'], e que as 'keys' de cada responsável são exatamente os cards
# certos (concluido_mes==mes, assignee==responsável). Será removido depois de usado.
on:
  workflow_dispatch:

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados (validação, sem publicar)
        run: python gen_data.py

      - name: "Gerar dashboard (só pra validar que build_dash.py não quebra, sem publicar)"
        run: python build_dash.py

      - name: "Diagnóstico: assignee em sweep.json + alocação por mês de conclusão x Bug por módulo"
        run: |
          python -c "
          import json, re
          raw = json.load(open('sweep.json'))
          d = json.load(open('dash_data.json'))

          has_assignee = all('assignee' in x for x in raw)
          print('Campo assignee presente em TODOS os cards de sweep.json:', has_assignee)
          print('Amostra (3 cards):', [x.get('assignee') for x in raw[:3]])
          print()

          # Recomputa direto do sweep.json bruto, com a MESMA régua de elegibilidade que
          # evol_modulo/_elegivel_evol usa em gen_data.py (BUG_TYPES, exclui Cancelado QA/Dev,
          # exclui status atual em IMPEDIMENTO PRODUTO/Backlog) — pra validar de forma
          # independente que a soma TOTAL (não só o top 10 exibido) bate exatamente com
          # 'Bug por módulo'.
          def modclean(m):
              return 'Não classificado' if not m else re.sub(r'^\d+\s*-\s*', '', str(m)).strip()
          sweep_full = [x for x in raw if modclean(x.get('modulo')) != 'Chat de Suporte']
          BUG_TYPES={'Bug Cliente','Bug QA','Bug Dev','Bug Backoffice'}
          RES_EXCLUI={'Cancelado QA','Cancelado Dev'}
          STATUS_EXCLUI={'IMPEDIMENTO PRODUTO','Backlog'}
          def elegivel(x):
              return x.get('itype') in BUG_TYPES and x.get('res') not in RES_EXCLUI and x.get('status') not in STATUS_EXCLUI

          meses_disp = sorted(d['aloc_por_mes'].keys())

          by_key = {x['key']: x for x in raw}

          def valida(mes):
              print(f'=== Mês de conclusão {mes} ===')
              full = [x for x in sweep_full if elegivel(x) and x.get('concluido_mes')==mes]
              soma_full = len(full)
              print(f'Soma TOTAL de concluídos nesse mês (recomputado direto do sweep.json, todos os responsáveis): {soma_full}')
              print('Top exibido no gráfico (d[aloc_por_mes][mes]):')
              for r in d['aloc_por_mes'][mes]:
                  keys = r.get('keys', [])
                  keys_ok = len(keys) == r['n'] and all(
                      by_key.get(k, {}).get('concluido_mes') == mes and
                      (by_key.get(k, {}).get('assignee') or 'Sem responsável') == r['resp']
                      for k in keys)
                  print(f\"  {r['resp']}: {r['n']} bugs ({r['pct']}%) — keys={keys[:3]}{'...' if len(keys)>3 else ''} (n_keys={len(keys)}, todas do responsável+mês certos: {keys_ok})\")
              soma_top = sum(r['n'] for r in d['aloc_por_mes'][mes])
              print(f'Soma exibida no gráfico (até 10 responsáveis): {soma_top}')

              ts = next((t for t in d['tot_series'] if t['mes']==mes), None)
              concl_bpm = ts['backlog_concluidos'] if ts else None
              print(f'Bug por módulo / Todos (d[tot_series]) concluídos: {concl_bpm}')
              print(f'CONFERE (soma total recomputada == concluídos Bug por módulo): {soma_full == concl_bpm}')
              print()

          print(f'Mês mais recente disponível: {meses_disp[-1]}')
          valida(meses_disp[-1])
          if len(meses_disp) >= 2:
              print(f'Mês anterior (fechado, amostra maior): {meses_disp[-2]}')
              valida(meses_disp[-2])
          "

      - name: "Diagnóstico: alocChart() gera data-keys/onclick + abrirCardsBar() existe"
        run: |
          grep -A6 "function alocChart" build_dash.py
          echo ---
          grep -A3 "function abrirCardsBar" build_dash.py
          echo ---
          python -c "
          import json
          d = json.load(open('dash_data.json'))
          mes = sorted(d['aloc_por_mes'].keys())[-1]
          r = d['aloc_por_mes'][mes][0]
          print(f'Exemplo de linha renderizada (responsável top 1 de {mes}):')
          print(f\"  data-keys=\\\"{','.join(r.get('keys', []))}\\\"\")
          print(f\"  onclick=\\\"abrirCardsBar(this)\\\" -> abre {{jira_base}}/issues/?jql=key in ({','.join(r.get('keys', []))})\")
          "
