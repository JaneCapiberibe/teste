name: Validação manual (temporário)

# Workflow TEMPORÁRIO — roda fetch_jira.py + gen_data.py (com os segredos do Jira) SEM
# publicar nada (sem build_dash.py/inject_login.py/deploy-pages), só pra validar números
# contra dado real antes de mergear em main. Será removido depois de usado.
on:
  workflow_dispatch:

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário pro snapshot_arquivo() em gen_data.py (git log --) — ver update.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: "Diagnóstico: issuetypes distintos no painel BUG (project = BUG)"
        run: |
          python -c "
          import json, collections
          sweep = json.load(open('sweep.json'))
          c = collections.Counter(x['itype'] for x in sweep)
          print('issuetypes distintos em project = BUG (sweep.json cru, sem filtro de tipo):')
          for k, v in c.most_common():
              print(f'  {k!r}: {v}')
          print('TOTAL:', sum(c.values()))
          "

      - name: Recalcular dados (validação, sem publicar)
        run: python gen_data.py
