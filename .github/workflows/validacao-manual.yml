name: Validação manual (temporário)

# Workflow TEMPORÁRIO — roda fetch_jira.py + gen_data.py + build_dash.py (com os segredos do
# Jira) SEM publicar nada, só pra: (1) validar que o link do card de Alerta operacional
# renderiza sem o texto extra "ver no Jira"; (2) investigar por que só 2 de 6 cards em "Não
# Iniciado" aparecem no alerta. Será removido depois de usado.
on:
  workflow_dispatch:

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados (validação, sem publicar)
        run: python gen_data.py

      - name: "Gerar dashboard (só pra validar que build_dash.py não quebra, sem publicar)"
        run: python build_dash.py

      - name: "Diagnóstico: TODOS os cards Não Iniciado (não só os >5 dias)"
        run: |
          python -c "
          import json, datetime
          sweep = json.load(open('sweep.json'))
          import numpy as np
          def busdays(a,b): return int(np.busday_count(a,b))
          TODAY = datetime.date.today()
          print('TODAY:', TODAY)
          rows = []
          for x in sweep:
              if x.get('status') != 'Não Iniciado': continue
              created = x.get('created')
              c = datetime.datetime.fromisoformat(created).date() if created else None
              bd = busdays(c, TODAY) if c else None
              rows.append((x['key'], created, bd, bd is not None and bd > 5))
          rows.sort(key=lambda r: -(r[2] or -999))
          print(f'TOTAL Não Iniciado: {len(rows)}')
          for key, created, bd, alerta in rows:
              print(f'  {key}: created={created} dias_uteis={bd} entra_no_alerta(>5)={alerta}')
          "

      - name: "Diagnóstico: link renderizado (sem texto extra)"
        run: |
          python -c "
          import json
          d = json.load(open('dash_data.json'))
          a = d['alerta_parados']
          for i in a['itens'][:3]:
              print(f\"  {i['key']} -> {i['url']}\")
          "
          grep -A2 "function alertCard" build_dash.py | head -4
