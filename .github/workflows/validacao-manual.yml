name: Validação manual (temporário)

# Workflow TEMPORÁRIO — roda fetch_jira.py + gen_data.py + build_dash.py (com os segredos do
# Jira) SEM publicar nada, só pra validar o novo cálculo de "Esforço por módulo" (top 10,
# horas) que agora exclui cards em IMPEDIMENTO DEV/PRODUTO e com resolution Cancelado Dev.
# Mostra, para o módulo de maior volume, horas ANTES (tabela_modulo, todos os cards) e DEPOIS
# (esforco_modulo_ativo, só ativos) da exclusão. Será removido depois de usado.
on:
  workflow_dispatch:

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados (validação, sem publicar)
        run: python gen_data.py

      - name: "Gerar dashboard (só pra validar que build_dash.py não quebra, sem publicar)"
        run: python build_dash.py

      - name: "Diagnóstico: esforço por módulo, ANTES x DEPOIS da exclusão"
        run: |
          python -c "
          import json
          d = json.load(open('dash_data.json'))
          tab = {r['mod']: r['horas'] for r in d['tabela_modulo']}
          ativo = {r['mod']: r['horas'] for r in d['esforco_modulo_ativo']}
          top_mod = d['tabela_modulo'][0]['mod']
          print(f'Módulo de maior volume (tabela_modulo[0]): {top_mod}')
          print(f'  ANTES (todos os cards, tabela_modulo):        {tab.get(top_mod)} h')
          print(f'  DEPOIS (só ativos, esforco_modulo_ativo):     {ativo.get(top_mod, \"(fora do top 10 ativo? ver abaixo)\")} h')
          print()
          print('Top 10 esforco_modulo_ativo (o que o gráfico custoModulo() vai desenhar):')
          for r in d['esforco_modulo_ativo']:
              print(f\"  {r['mod']}: {r['horas']} h\")
          print()
          print('Top 10 tabela_modulo por horas, pra comparação lado a lado (mesmos módulos, TODOS os cards):')
          top10_ativo_mods = {r['mod'] for r in d['esforco_modulo_ativo']}
          for m in top10_ativo_mods:
              print(f'  {m}: antes={tab.get(m)} h -> depois={ativo.get(m)} h (diff={round((tab.get(m) or 0)-(ativo.get(m) or 0),1)} h)')
          "

      - name: "Diagnóstico: nota do painel atualizada"
        run: grep -A1 "Esforço distribuído" build_dash.py
