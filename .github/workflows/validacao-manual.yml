name: Validação manual (temporário)

# Workflow TEMPORÁRIO — roda fetch_jira.py + gen_data.py + build_dash.py (com os segredos do
# Jira) SEM publicar nada, só pra validar a nova seção "Cards em desenvolvimento por
# desenvolvedor" (dentro de "Diagnóstico do mês"): campo assignee_avatar (foto do Jira) e
# em_dev_data (1ª entrada em "Em Desenvolvimento", via changelog já buscado em lote) em
# sweep.json, d['em_dev_devs'] em dash_data.json, e — crítico — se a URL de avatar do Jira
# carrega SEM sessão autenticada (testado com curl sem nenhum header de auth, simulando um
# navegador sem login ativo no Jira). Será removido depois de usado.
on:
  workflow_dispatch:

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados (validação, sem publicar)
        run: python gen_data.py

      - name: "Gerar dashboard (só pra validar que build_dash.py não quebra, sem publicar)"
        run: python build_dash.py

      - name: "Diagnóstico: assignee_avatar e em_dev_data em sweep.json"
        run: |
          python -c "
          import json
          sweep = json.load(open('sweep.json'))
          com_avatar = [x for x in sweep if x.get('assignee_avatar')]
          print(f'Total de cards em sweep.json: {len(sweep)}')
          print(f'Cards com assignee_avatar preenchido: {len(com_avatar)}')
          print('Amostra (3 URLs de avatar):')
          for x in com_avatar[:3]:
              print(f\"  {x['key']} ({x.get('assignee')}): {x['assignee_avatar']}\")
          print()
          em_dev = [x for x in sweep if x.get('status')=='Em Desenvolvimento']
          com_data = [x for x in em_dev if x.get('em_dev_data')]
          print(f'Cards em \"Em Desenvolvimento\": {len(em_dev)}')
          print(f'  com em_dev_data (changelog OK): {len(com_data)}')
          print(f'  SEM em_dev_data (changelog sem a transição registrada): {len(em_dev)-len(com_data)}')
          for x in com_data[:3]:
              print(f\"  {x['key']}: em_dev_data={x['em_dev_data']}\")
          # salva uma URL de avatar real pro próximo step testar com curl puro (sem auth)
          if com_avatar:
              open('avatar_url_teste.txt','w').write(com_avatar[0]['assignee_avatar'])
          "

      - name: "Diagnóstico: d['em_dev_devs'] em dash_data.json"
        run: |
          python -c "
          import json
          d = json.load(open('dash_data.json'))
          rows = d.get('em_dev_devs', [])
          print(f'Total de linhas em d[em_dev_devs]: {len(rows)}')
          print('Top 5 (ordenado por dias desc):')
          for r in rows[:5]:
              print(f\"  {r['key']} · {r['resp']} · {r['mod']} · prio={r['prio']} · entrada={r['data_entrada']} · dias={r['dias']} · avatar={'sim' if r['avatar'] else 'não'}\")
          # confere ordenação decrescente por dias (None tratado como o menor)
          vals = [(r['dias'] if r['dias'] is not None else -1) for r in rows]
          ordenado = all(vals[i] >= vals[i+1] for i in range(len(vals)-1))
          print(f'Ordenado por dias desc: {ordenado}')
          # confere que todos os itens realmente estão em Em Desenvolvimento (cruza com sweep)
          sweep = {x['key']: x for x in json.load(open('sweep.json'))}
          todos_em_dev = all(sweep.get(r['key'], {}).get('status')=='Em Desenvolvimento' for r in rows)
          print(f'Todos os itens realmente com status atual Em Desenvolvimento: {todos_em_dev}')
          "

      - name: "TESTE CRÍTICO: avatar do Jira carrega sem sessão autenticada?"
        run: |
          if [ -s avatar_url_teste.txt ]; then
            URL=$(cat avatar_url_teste.txt)
            echo "Testando URL sem NENHUM header de auth (simula navegador sem login no Jira): $URL"
            HTTP_CODE=$(curl -s -o /tmp/avatar_resp -w "%{http_code}" "$URL")
            CONTENT_TYPE=$(curl -s -I "$URL" | grep -i "content-type" || echo "sem content-type")
            SIZE=$(wc -c < /tmp/avatar_resp)
            echo "HTTP status: $HTTP_CODE"
            echo "Content-Type: $CONTENT_TYPE"
            echo "Tamanho da resposta: $SIZE bytes"
            file /tmp/avatar_resp || true
            if [ "$HTTP_CODE" = "200" ] && file /tmp/avatar_resp | grep -qi "image"; then
              echo "RESULTADO: a URL carrega uma IMAGEM real sem autenticação — avatar público."
            else
              echo "RESULTADO: a URL NÃO devolveu uma imagem sem autenticação (status $HTTP_CODE) — precisa do fallback de iniciais."
            fi
          else
            echo "Nenhuma URL de avatar disponível pra testar (nenhum card com assignee_avatar preenchido)."
          fi

      - name: "Diagnóstico: seção renderizada em build_dash.py (helpers + fallback de iniciais)"
        run: |
          grep -A5 "function initials" build_dash.py
          echo ---
          grep -A6 "function devAvatar" build_dash.py
          echo ---
          grep -A6 "function prioBadge" build_dash.py
          echo ---
          grep -n "devsEmDesenvolvimento()" build_dash.py
