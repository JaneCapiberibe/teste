name: Validação manual (temporário)

# Workflow TEMPORÁRIO — roda fetch_jira.py + gen_data.py + build_dash.py (com os segredos do
# Jira) SEM publicar nada, só pra validar que "Esforço por módulo" agora muda por safra (mês
# de criação selecionado no topo do dashboard), com a mesma exclusão de IMPEDIMENTO DEV/PRODUTO
# e Cancelado Dev de antes. Mostra o top 10 de horas para algumas safras diferentes, pro módulo
# de maior volume, pra comparar com o valor de todo o período. Será removido depois de usado.
on:
  workflow_dispatch:

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados (validação, sem publicar)
        run: python gen_data.py

      - name: "Gerar dashboard (só pra validar que build_dash.py não quebra, sem publicar)"
        run: python build_dash.py

      - name: "Diagnóstico: esforço por módulo, por safra x todo o período"
        run: |
          python -c "
          import json
          d = json.load(open('dash_data.json'))
          porMes = d['esforco_modulo_por_mes']
          ativo = {r['mod']: r['horas'] for r in d['esforco_modulo_ativo']}
          meses = sorted(porMes.keys())
          print(f'Total de safras (meses) com cálculo: {len(meses)}')
          print(f'Safra default (funil_default): {d[\"funil_default\"]}')
          print()
          print('TODO O PERÍODO (esforco_modulo_ativo, top 10):')
          for r in d['esforco_modulo_ativo']:
              print(f\"  {r['mod']}: {r['horas']} h\")
          print()
          amostra = [meses[-1], meses[-2], meses[-3], meses[0]]
          for mes in amostra:
              lst = porMes.get(mes, [])
              print(f'--- Safra {mes} (top 10 do gráfico se essa safra estiver selecionada): {len(lst)} módulo(s) com horas')
              for r in lst[:10]:
                  print(f\"    {r['mod']}: {r['horas']} h\")
              if not lst:
                  print('    (vazio -> gráfico cai no fallback: todo o período)')
          "

      - name: "Diagnóstico: custoModulo() lê curSafra() e o label da safra no painel"
        run: |
          grep -A5 "function custoModulo" build_dash.py
          echo ---
          grep -B1 -A2 "Esforço por módulo (top 10, horas)" build_dash.py
