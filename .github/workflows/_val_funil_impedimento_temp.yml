name: "[TEMP] Validação — funil Confirmados x Impedimento Produto"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch a validar'
        required: true
        default: 'claude/funil-confirmados-impedimento-produto'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados
        run: python gen_data.py

      - name: Gerar o dashboard (sanity check do pipeline completo)
        run: python build_dash.py

      - name: Comparar Confirmados (funil) x criado (Evolução por módulo) — mês corrente
        run: |
          python3 -c "
          import json
          d = json.load(open('dash_data.json'))
          em = d['evol_modulo']
          meses = em['meses']
          mes_ref = d['funil']['mes']
          mi = meses.index(mes_ref)
          criado_ref = sum(serie['criados'][mi] for serie in em['por_modulo'].values())
          confirmados_ref = d['funil']['confirmados']
          chegaram_dev = d['funil']['chegaram_dev']
          print('Mes de referencia do funil (corrente):', mes_ref)
          print('criado (evol_modulo, soma todos os modulos):', criado_ref)
          print('confirmados (funil):', confirmados_ref)
          print('chegaram_dev (funil, sem o corte de Impedimento Produto):', chegaram_dev)
          print('OK: criado == confirmados' if criado_ref == confirmados_ref else f'DIVERGE ainda: diff={criado_ref-confirmados_ref}')
          "

      - name: Comparar explicitamente setembro/2026 (o mes que a Jane reportou)
        run: |
          python3 -c "
          import importlib.util, json
          spec = importlib.util.spec_from_file_location('gen_data_mod', 'gen_data.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)  # roda gen_data.py de novo (sweep.json ja esta local, nao faz novo fetch)

          f_set = mod.build_funil('2026-09')
          em = json.load(open('dash_data.json'))['evol_modulo']
          mi = em['meses'].index('2026-09')
          criado_set = sum(serie['criados'][mi] for serie in em['por_modulo'].values())

          print('=== Setembro/2026 (mes fechado, reportado pela Jane) ===')
          print('criado (evol_modulo, soma todos os modulos):', criado_set)
          print('confirmados (funil, apos o fix):', f_set['confirmados'])
          print('chegaram_dev (funil, sem o corte de Impedimento Produto):', f_set['chegaram_dev'])
          print('diferenca chegaram_dev - confirmados (= cards excluidos por Impedimento Produto no mes):', f_set['chegaram_dev'] - f_set['confirmados'])
          print()
          print('OK: criado == confirmados em setembro' if criado_set == f_set['confirmados'] else f'AINDA DIVERGE em setembro: diff={criado_set-f_set[\"confirmados\"]}')
          "

      - name: Checar cards reais em Impedimento Produto (base liquida, todo o periodo)
        run: |
          python3 -c "
          import json
          sweep = json.load(open('sweep.json'))
          imped = [x for x in sweep if x.get('status')=='IMPEDIMENTO PRODUTO']
          print('Total de cards (sweep, base liquida) em IMPEDIMENTO PRODUTO agora:', len(imped))
          for x in imped:
              print(' ', x['key'], '| criado:', x['created'][:7], '| modulo:', x.get('modulo'))
          "

      - name: Upload dash_data.json como artifact
        uses: actions/upload-artifact@v4
        with:
          name: funil-impedimento-dash-data
          path: dash_data.json
          retention-days: 5
