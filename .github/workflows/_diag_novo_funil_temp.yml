name: "[TEMP] Diagnóstico: números do novo funil (mockup)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira (BUG)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Calcular os números do novo funil proposto
        run: |
          python3 -c "
          import json, re, datetime

          sweep_full = json.load(open('sweep.json'))
          def pdt(s):
              if not s: return None
              return datetime.datetime.fromisoformat(s)
          def mn(m): return 'Não classificado' if not m else re.sub(r'^\d+\s*-\s*','',str(m)).strip()
          for x in sweep_full:
              x['c']=pdt(x['created'])
              x['m']=mn(x['modulo'])

          EXCLUI_MOD={'Chat de Suporte'}
          sweep_full=[x for x in sweep_full if x['m'] not in EXCLUI_MOD]

          cur_m = str(datetime.date.today())[:7]
          mkeys = sorted({x['c'].strftime('%Y-%m') for x in sweep_full if x['c']})
          ref = cur_m if cur_m in mkeys else max(mkeys)
          print('safra em foco:', ref)

          crj = [x for x in sweep_full if x['c'] and x['c'].strftime('%Y-%m')==ref]
          criados = len(crj)

          ST_ENTREGUE_FUNIL={'Em produção','Em Produção','Done','Concluído','Concluido'}

          # variante A: corte de Backlog só (como no desenho da Jane)
          backlog_a = [x for x in crj if x['status']=='Backlog']
          resto_a = [x for x in crj if x['status']!='Backlog']
          qa_a = [x for x in resto_a if x['res']=='Cancelado QA']
          resto2_a = [x for x in resto_a if x['res']!='Cancelado QA']
          chegaram_dev_a = len(resto2_a)
          dev_a = [x for x in resto2_a if x['res']=='Cancelado Dev']
          confirmados_a = [x for x in resto2_a if x['res']!='Cancelado Dev']
          entregues_a = [x for x in confirmados_a if x['status'] in ST_ENTREGUE_FUNIL]
          fila_a = [x for x in confirmados_a if x['status'] not in ST_ENTREGUE_FUNIL]

          print()
          print('=== VARIANTE A: corte só de Backlog ===')
          print('criados:', criados)
          print('corte backlog:', len(backlog_a))
          print('chegaram ao dev (pos backlog, pos QA):', chegaram_dev_a)
          print('corte cancelado QA:', len(qa_a))
          print('corte cancelado dev:', len(dev_a))
          print('confirmados:', len(confirmados_a))
          print('entregues:', len(entregues_a))
          print('fila:', len(fila_a))
          print('fila por status:', {})

          import collections
          fila_status_a = collections.Counter(x['status'] for x in fila_a)
          print('fila por status (variante A):', dict(fila_status_a))

          # variante B: corte de Backlog + Impedimento Produto (bate sempre com a regua oficial)
          backlog_b = [x for x in crj if x['status'] in ('Backlog','IMPEDIMENTO PRODUTO')]
          resto_b = [x for x in crj if x['status'] not in ('Backlog','IMPEDIMENTO PRODUTO')]
          qa_b = [x for x in resto_b if x['res']=='Cancelado QA']
          resto2_b = [x for x in resto_b if x['res']!='Cancelado QA']
          chegaram_dev_b = len(resto2_b)
          dev_b = [x for x in resto2_b if x['res']=='Cancelado Dev']
          confirmados_b = [x for x in resto2_b if x['res']!='Cancelado Dev']
          entregues_b = [x for x in confirmados_b if x['status'] in ST_ENTREGUE_FUNIL]
          fila_b = [x for x in confirmados_b if x['status'] not in ST_ENTREGUE_FUNIL]

          print()
          print('=== VARIANTE B: corte de Backlog + Impedimento Produto ===')
          print('criados:', criados)
          print('corte backlog+impedimento produto:', len(backlog_b))
          print('chegaram ao dev:', chegaram_dev_b)
          print('corte cancelado QA:', len(qa_b))
          print('corte cancelado dev:', len(dev_b))
          print('confirmados:', len(confirmados_b))
          print('entregues:', len(entregues_b))
          print('fila:', len(fila_b))
          fila_status_b = collections.Counter(x['status'] for x in fila_b)
          print('fila por status (variante B):', dict(fila_status_b))

          # regua oficial (Bug por modulo) pra conferencia
          BUG_TYPES={'Bug Cliente','Bug QA','Bug Dev','Bug Backoffice'}
          RES_EXCLUI_ACUM={'Cancelado QA','Cancelado Dev'}
          STATUS_EXCLUI_ACUM={'IMPEDIMENTO PRODUTO','Backlog'}
          def elegivel(x):
              return x['itype'] in BUG_TYPES and x['res'] not in RES_EXCLUI_ACUM and x['status'] not in STATUS_EXCLUI_ACUM
          print()
          print('regua oficial (Bug por modulo) pra conferencia:', len([x for x in crj if elegivel(x)]))
          "
