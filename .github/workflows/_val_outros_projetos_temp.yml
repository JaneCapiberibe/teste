name: "[TEMP] Validação — 14 projetos novos + unificação em desenvolvimento/andamento"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch a validar'
        required: true
        default: 'claude/devs-todos-projetos-jira'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira (BUG, BACKOFFICE, SUS, PEM + 14 novos projetos)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Checagem 1 — quais sweep_<projeto>.json foram gerados (projeto com pelo menos 1 issue)
        run: |
          ls -la sweep_*.json
          echo "---"
          for f in sweep_dl.json sweep_gtms1.json sweep_infra.json sweep_ipca.json sweep_ldo.json sweep_mel.json sweep_nf.json sweep_ow.json sweep_pbim.json sweep_plg.json sweep_pm.json sweep_pp.json sweep_scdc.json sweep_sofia.json; do
            if [ -f "$f" ]; then
              n=$(python3 -c "import json; print(len(json.load(open('$f'))))")
              echo "$f: $n issues"
            else
              echo "$f: NÃO gerado (projeto vazio ou 0 issues)"
            fi
          done

      - name: Recalcular dados
        run: python gen_data.py

      - name: Gerar o dashboard
        run: python build_dash.py

      - name: Checagem 2 — total de Concluídos NÃO mudou (continua só BUG/MB/SUS/PEM)
        run: |
          python3 -c "
          import json
          d = json.load(open('dash_data.json'))
          D = d['devs']
          cur = D['meses'][-1]
          problemas = 0
          for dev, pessoa in D['pessoas'].items():
              k = pessoa['metrics_jira']['kpi_por_mes'].get(cur, {})
              pp = k.get('concluidos_por_projeto', {})
              soma4 = sum(v['n'] for v in pp.values())
              tot = k.get('concluidos', 0)
              if soma4 != tot:
                  problemas += 1
                  print(f'DIVERGENCIA: {dev}: soma dos 4 projetos ({soma4}) != total ({tot})')
          print('RESULTADO:', 'OK — total bate com a soma dos 4 projetos originais em todo mundo' if problemas == 0 else f'{problemas} problema(s)')
          "

      - name: Checagem 3 — quem tem atividade nos 14 projetos novos (concluidos_outros_projetos)
        run: |
          python3 -c "
          import json
          d = json.load(open('dash_data.json'))
          D = d['devs']
          cur = D['meses'][-1]
          achou = False
          for dev, pessoa in D['pessoas'].items():
              k = pessoa['metrics_jira']['kpi_por_mes'].get(cur, {})
              outros = k.get('concluidos_outros_projetos', [])
              if outros:
                  achou = True
                  print(f'{dev} / {cur}: {outros}')
          if not achou:
              print('Nenhum dev com concluídos nos 14 projetos novos na safra atual (pode ser normal — baixo volume nesses projetos).')
          "

      - name: Checagem 4 — \"Em desenvolvimento agora\" inclui status tipo \"em andamento\" dos projetos novos
        run: |
          python3 -c "
          import json
          d = json.load(open('dash_data.json'))
          D = d['devs']
          em = D.get('em_dev_combinado', [])
          print('Total em_dev_combinado:', len(em))
          outros_proj = {'DL','GTMS1','INFRA','IPCA','LDO','MEL','NF','OW','PBIM','PLG','PM','PP','SCDC','SOFIA'}
          de_outros = [r for r in em if r.get('origem') in outros_proj]
          print(f'Cards de \"em desenvolvimento/andamento\" vindos dos 14 projetos novos: {len(de_outros)}')
          for r in de_outros[:15]:
              print(f'  {r[\"key\"]} ({r[\"origem\"]}) — {r[\"resp\"]} — dias: {r.get(\"dias\")}')
          "

      - name: Checagem 5 — assert interno de Ciclo de vida (gen_data.py) já rodou no passo 'Recalcular dados' acima
        run: echo "ver o passo 'Recalcular dados' acima — ele imprime OK ou lista as chaves faltando"

      - name: Upload dash_data.json e sweep_*.json como artifact
        uses: actions/upload-artifact@v4
        with:
          name: outros-projetos-dash-data
          path: |
            dash_data.json
            sweep_*.json
          retention-days: 5
