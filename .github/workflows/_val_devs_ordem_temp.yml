name: "[TEMP] Validação — devs ordenados por concluídos"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch a validar'
        required: true
        default: 'claude/devs-ordem-por-concluidos'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados
        run: python gen_data.py

      - name: Gerar o dashboard (sanity check do pipeline completo)
        run: python build_dash.py

      - name: Simular devsAtivosNaSafra() (ordem decrescente por concluídos) com dados reais
        run: |
          python3 -c "
          import json
          d = json.load(open('dash_data.json'))
          D = d['devs']
          cur = D['meses'][-1]
          print('Safra mais recente (equivalente a curSafra() default):', cur)
          print()
          linhas = []
          for dev in D['ordem']:
              k = D['pessoas'][dev]['metrics_jira'].get('kpi_por_mes', {}).get(cur, {})
              linhas.append((dev, k.get('concluidos', 0)))
          ordenado = sorted(linhas, key=lambda t: -t[1])
          print(f\"{'dev':35s} {'concluidos':>10s}\")
          for dev, c in ordenado:
              print(f'{dev:35s} {c:10d}')
          print()
          vals = [c for _, c in ordenado]
          ok = all(vals[i] >= vals[i+1] for i in range(len(vals)-1))
          print('OK: ordem decrescente' if ok else 'DIVERGE: não está decrescente')
          "

      - name: Upload dash_data.json como artifact
        uses: actions/upload-artifact@v4
        with:
          name: devs-ordem-dash-data
          path: dash_data.json
          retention-days: 5
