name: "[TEMP] Dump completo do módulo Desenvolvedores"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados
        run: python gen_data.py

      - name: Extrair módulo Desenvolvedores (completo, legível)
        run: |
          python3 -c "
          import json
          d = json.load(open('dash_data.json'))
          devs = d['devs']
          json.dump(devs, open('devs_module_full.json', 'w'), ensure_ascii=False, indent=1)
          print('Tamanho:', len(json.dumps(devs)), 'bytes')
          print('Pessoas:', len(devs.get('pessoas', {})))
          print('Meses:', devs.get('meses'))
          "

      - name: Commitar dump numa branch separada (bypass de artifact storage)
        run: |
          git config user.name "claude-dump-bot"
          git config user.email "noreply@anthropic.com"
          git checkout --orphan claude/devs-module-dump-data
          git rm -rf --cached . > /dev/null 2>&1 || true
          mkdir -p dump_output
          cp dash_data.json devs_module_full.json dump_output/ 2>/dev/null || true
          cp sweep_*.json dump_output/ 2>/dev/null || true
          git add dump_output
          git commit -m "dump de dados (temporário, não mergear)"
          git push -f origin claude/devs-module-dump-data
