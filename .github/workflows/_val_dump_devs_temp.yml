name: "[TEMP] Dump completo do módulo Desenvolvedores"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados
        run: python gen_data.py

      - name: Extrair módulo Desenvolvedores (completo, legível)
        run: |
          python3 -c "
          import json
          d = json.load(open('dash_data.json'))
          devs = d['devs']
          json.dump(devs, open('devs_module_full.json', 'w'), ensure_ascii=False, indent=1)
          print('Tamanho:', len(json.dumps(devs)), 'bytes')
          print('Pessoas:', len(devs.get('pessoas', {})))
          print('Meses:', devs.get('meses'))
          "

      - name: Upload artifact (dash_data.json completo + módulo Desenvolvedores isolado + sweeps)
        uses: actions/upload-artifact@v4
        with:
          name: devs-module-dump
          path: |
            dash_data.json
            devs_module_full.json
            sweep_*.json
          retention-days: 5
