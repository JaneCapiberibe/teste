name: "[TEMP] Diagnóstico: status do seletor + coluna Status atual (Ciclo de vida)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Rodar pipeline
        run: python gen_data.py

      - name: Conferir última ocorrência de cada status (recência)
        run: |
          python3 -c "
          import json, collections, datetime
          sweep=json.load(open('sweep.json'))
          sc_all=json.load(open('status_changelog.json'))
          sweep_keys={x['key'] for x in sweep}
          last_seen={}
          cur_count=collections.Counter()
          def upd(s, iso_or_none):
              if not s: return
              if iso_or_none is None:
                  last_seen.setdefault(s, None)
                  return
              dt=datetime.datetime.fromisoformat(iso_or_none)
              if s not in last_seen or last_seen[s] is None or dt>last_seen[s]:
                  last_seen[s]=dt
          for x in sweep:
              cur_count[x['status']]+=1
          for k in sweep_keys:
              sc=sc_all.get(k)
              if not sc: continue
              for iso,to in (sc.get('mudancas') or []):
                  upd(to, iso)
          for x in sweep:
              # status atual conta como 'visto agora' -> usa 'updated' do card como proxy de recencia
              if x.get('updated'):
                  upd(x['status'], x['updated'])
          print('=== status ordenado por ÚLTIMA ocorrência (mais recente primeiro) ===')
          rows=sorted(last_seen.items(), key=lambda kv: (kv[1] is not None, kv[1]), reverse=True)
          for s,dt in rows:
              print(f'{s!r:35s} ultima_ocorrencia={dt} | cards_atuais_agora={cur_count.get(s,0)}')
          "
