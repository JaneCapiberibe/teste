name: "[TEMP] Validação: funil reorganizado (Backlog + Confirmados)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira (BUG + BACKOFFICE)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Rodar pipeline completo (gen_data + build_dash)
        run: python gen_data.py && python build_dash.py

      - name: Conferir o funil reorganizado contra o Jira real
        run: |
          python3 -c "
          import json
          d = json.load(open('dash_data.json'))
          f = d['funil']
          print('funil (safra atual):', f)
          print()
          BUG_TYPES={'Bug Cliente','Bug QA','Bug Dev','Bug Backoffice'}
          RES_EXCLUI_ACUM={'Cancelado QA','Cancelado Dev'}
          STATUS_EXCLUI_ACUM={'IMPEDIMENTO PRODUTO','Backlog'}
          sweep = json.load(open('sweep.json'))
          import re
          def mn(m): return 'Não classificado' if not m else re.sub(r'^\d+\s*-\s*','',str(m)).strip()
          for x in sweep: x['m']=mn(x['modulo'])
          def elegivel(x):
              return x['itype'] in BUG_TYPES and x['res'] not in RES_EXCLUI_ACUM and x['status'] not in STATUS_EXCLUI_ACUM
          regua = sum(1 for x in sweep if x.get('concluido_mes') is None and elegivel(x) and x.get('created','').startswith(f['mes']))
          print('checagem: confirmados =', f['confirmados'], '| soma etapas =', f['backlog']+f['descartados_qa']+f['chegaram_dev'], '(deve ser: backlog+qa+chegaram_dev == total)')
          print('total ==', f['total'], '== backlog+descartados_qa+chegaram_dev?', f['total']==f['backlog']+f['descartados_qa']+f['chegaram_dev'])
          print('chegaram_dev ==', f['chegaram_dev'], '== cancelados_dev+confirmados?', f['chegaram_dev']==f['cancelados_dev']+f['confirmados'])
          print('confirmados ==', f['confirmados'], '== entregues+fila?', f['confirmados']==f['entregues']+f['fila'])
          "

      - name: Rodar inject_login.py (garante que o pipeline publica sem erro)
        run: python inject_login.py
