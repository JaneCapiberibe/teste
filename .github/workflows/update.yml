name: Atualizar dashboard (2x/dia)

on:
  schedule:
    # 17/11/2026: disparo antecipado pra compensar o atraso do agendador do GitHub Actions perto
    # do meio-dia UTC (observado de 3h a 6h de atraso nesse horário, bem maior que em outros
    # horários do dia) — o pedido era o dashboard estar PRONTO às 9:00 e 15:00 (Brasília), não
    # necessariamente que o cron dispare exatamente nesses horários. Cron às 06:00 e 14:00 UTC
    # (03:00 e 11:00 Brasília) dá margem de 6h e 4h respectivamente antes do horário-alvo.
    # Ainda não há dado histórico de atraso exatamente nesses horários — se não bastar, ajustar.
    - cron: '0 6,14 * * *'   # 06:00 e 14:00 UTC = 03:00 e 11:00 (horário de Brasília).
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 (histórico completo) — não é mais exigido por gen_data.py (a função
          # snapshot_arquivo(), que usava `git log` pra achar a data do último export do CSV de
          # Time-in-Status, foi removida em 09/09/2026 junto com o CSV; previsibilidade/SLA agora
          # vêm do changelog do Jira). Mantido como está por não ser parte do escopo desta mudança
          # — revisar se ainda é necessário para algo antes de trocar para checkout raso.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados
        run: python gen_data.py

      - name: Gerar o dashboard
        run: python build_dash.py

      - name: Proteger com login e montar publicação
        run: python inject_login.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      # 04/11/2026: essa execução falhou porque o GitHub Pages ficou mais de 10 minutos
      # (o timeout padrão da action) em "updating_pages" — o artifact já tinha sido publicado
      # com sucesso, só a propagação do lado do GitHub Pages que demorou. timeout maior dá
      # mais margem antes de abortar; retries tenta de novo se ainda assim vier a falhar (ex.:
      # instabilidade pontual do GitHub Pages), em vez de deixar o dashboard parado até a
      # próxima execução agendada.
      #
      # 23/11/2026: a falha de 22/11 não foi timeout — foi o deploy-pages buscando o artifact
      # 0,3s depois do upload-pages-artifact terminar, antes do GitHub indexar ("Found 0
      # artifact(s)"). O retry rodou igual de rápido e bateu no mesmo erro. Espera antes de cada
      # tentativa dá tempo da indexação propagar.
      - name: Esperar propagação do artifact antes do deploy
        run: sleep 15

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
        continue-on-error: true

      - name: Esperar mais um pouco antes do retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Tentar de novo se o deploy falhou
        if: steps.deploy.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000

      - name: Falhar o job se nenhuma tentativa de deploy deu certo
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        run: exit 1
