name: Atualizar dashboard (2x/dia)

on:
  schedule:
    - cron: '0 12,18 * * *'   # 12:00 e 18:00 UTC = 09:00 e 15:00 (horário de Brasília). Ajuste se quiser.
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 (histórico completo) — não é mais exigido por gen_data.py (a função
          # snapshot_arquivo(), que usava `git log` pra achar a data do último export do CSV de
          # Time-in-Status, foi removida em 09/09/2026 junto com o CSV; previsibilidade/SLA agora
          # vêm do changelog do Jira). Mantido como está por não ser parte do escopo desta mudança
          # — revisar se ainda é necessário para algo antes de trocar para checkout raso.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados
        run: python gen_data.py

      - name: Gerar o dashboard
        run: python build_dash.py

      - name: Proteger com login e montar publicação
        run: python inject_login.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      # 04/11/2026: essa execução falhou porque o GitHub Pages ficou mais de 10 minutos
      # (o timeout padrão da action) em "updating_pages" — o artifact já tinha sido publicado
      # com sucesso, só a propagação do lado do GitHub Pages que demorou. timeout maior dá
      # mais margem antes de abortar; retries tenta de novo se ainda assim vier a falhar (ex.:
      # instabilidade pontual do GitHub Pages), em vez de deixar o dashboard parado até a
      # próxima execução agendada.
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
        continue-on-error: true

      - name: Tentar de novo se o deploy falhou
        if: steps.deploy.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000

      - name: Falhar o job se nenhuma tentativa de deploy deu certo
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        run: exit 1
