name: "[TEMP] Diagnóstico: Criados funil x Bug por módulo"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira (BUG)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Comparar universo "criados" do funil x régua oficial (Bug por módulo)
        run: |
          python3 -c "
          import json, re, datetime, collections

          sweep_full = json.load(open('sweep.json'))
          def pdt(s):
              if not s: return None
              return datetime.datetime.fromisoformat(s)
          def mn(m): return 'Não classificado' if not m else re.sub(r'^\d+\s*-\s*','',str(m)).strip()
          for x in sweep_full:
              x['c']=pdt(x['created'])
              x['m']=mn(x['modulo'])

          EXCLUI_MOD={'Chat de Suporte'}
          sweep_full=[x for x in sweep_full if x['m'] not in EXCLUI_MOD]

          cur_m = str(datetime.date.today())[:7]
          mkeys = sorted({x['c'].strftime('%Y-%m') for x in sweep_full if x['c']})
          ref = cur_m if cur_m in mkeys else max(mkeys)
          print('safra em foco:', ref)

          crj = [x for x in sweep_full if x['c'] and x['c'].strftime('%Y-%m')==ref]
          print('funil (\"Criados\", sweep_full sem filtro de tipo/status/resolucao):', len(crj))

          BUG_TYPES={'Bug Cliente','Bug QA','Bug Dev','Bug Backoffice'}
          RES_EXCLUI_ACUM={'Cancelado QA','Cancelado Dev'}
          STATUS_EXCLUI_ACUM={'IMPEDIMENTO PRODUTO','Backlog'}
          def elegivel(x):
              return x['itype'] in BUG_TYPES and x['res'] not in RES_EXCLUI_ACUM and x['status'] not in STATUS_EXCLUI_ACUM
          criaD = [x for x in crj if elegivel(x)]
          print('regua oficial (\"Bug por modulo\"):', len(criaD))
          print('diferenca:', len(crj) - len(criaD))
          print()

          fora_tipo = [x for x in crj if x['itype'] not in BUG_TYPES]
          fora_res = [x for x in crj if x['itype'] in BUG_TYPES and x['res'] in RES_EXCLUI_ACUM]
          fora_status = [x for x in crj if x['itype'] in BUG_TYPES and x['res'] not in RES_EXCLUI_ACUM and x['status'] in STATUS_EXCLUI_ACUM]

          print(f'fora por TIPO (nao é Bug Cliente/QA/Dev/Backoffice): {len(fora_tipo)}')
          for x in fora_tipo: print(f'  - {x[\"key\"]}: itype={x[\"itype\"]!r} status={x[\"status\"]!r} res={x[\"res\"]!r}')
          print()
          print(f'fora por RESOLUCAO (Cancelado QA/Dev): {len(fora_res)}')
          for x in fora_res: print(f'  - {x[\"key\"]}: itype={x[\"itype\"]!r} status={x[\"status\"]!r} res={x[\"res\"]!r}')
          print()
          print(f'fora por STATUS ATUAL (Backlog/Impedimento Produto): {len(fora_status)}')
          for x in fora_status: print(f'  - {x[\"key\"]}: itype={x[\"itype\"]!r} status={x[\"status\"]!r} res={x[\"res\"]!r}')
          print()
          print('checagem:', len(fora_tipo)+len(fora_res)+len(fora_status), '== diferenca?', len(crj)-len(criaD))
          "
