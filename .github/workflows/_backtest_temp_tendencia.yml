name: "[TEMP] Backtest run-rate vs regressão (Tendência dos módulos)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Rodar backtest (análise exploratória, não mexe no pipeline)
        run: python _backtest_temp_tendencia.py

      - name: Upload resultado (JSON)
        uses: actions/upload-artifact@v4
        with:
          name: backtest-tendencia-resultado
          path: backtest_resultado.json
          retention-days: 7
