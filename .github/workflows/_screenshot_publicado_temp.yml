name: "[TEMP] Screenshot do dashboard publicado (funil)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Puxar do Jira (BUG + BACKOFFICE)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Rodar pipeline completo (igual ao update.yml)
        run: |
          python gen_data.py
          python build_dash.py
          python inject_login.py

      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Screenshot do painel "Diagnóstico do mês"
        run: |
          python3 -c "
          import glob, re
          from playwright.sync_api import sync_playwright

          fname = glob.glob('public/dashboard_setor_*.html')[0]
          print('arquivo:', fname)

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width':1300,'height':1400})
              page.add_init_script('sessionStorage.setItem(\"of_dash_auth\",\"1\")')
              page.goto('file://' + __import__('os').path.abspath(fname))
              page.wait_for_timeout(500)
              h2 = page.query_selector('h2:has-text(\"Diagnóstico do mês\")')
              box = page.evaluate('''(h2el) => {
                  const panel = h2el.nextElementSibling;
                  const r = panel.getBoundingClientRect();
                  return {x: r.x, y: r.y, width: r.width, height: r.height};
              }''', h2)
              page.screenshot(path='funil_publicado.png', clip=box)
              browser.close()
          print('screenshot OK')
          "

      - uses: actions/upload-artifact@v4
        with:
          name: funil-publicado-screenshot
          path: funil_publicado.png
          retention-days: 1
