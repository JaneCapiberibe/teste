name: Levantamento manual (temporário)

# Workflow TEMPORÁRIO, só pra rodar levantamento_cancelado_dev.py com os segredos do
# Jira e ler o resultado no log. Não faz parte do pipeline publicado (não mexe em
# sweep.json/dash_data.json/dashboard_setor.html) e será removido depois de usado.
on:
  workflow_dispatch:

jobs:
  levantamento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar levantamento
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python levantamento_cancelado_dev.py
