name: "[TEMP] Validação — módulo Produtos e Melhoria (PEM)"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch a validar'
        required: true
        default: 'claude/produtos-melhoria-modulo'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Puxar do Jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: python fetch_jira.py

      - name: Recalcular dados
        run: python gen_data.py

      - name: Gerar o dashboard (sanity check do pipeline completo)
        run: python build_dash.py

      - name: Resumo do módulo Produtos e Melhoria (d['produtos'])
        run: |
          python3 -c "
          import json
          d = json.load(open('dash_data.json'))
          p = d['produtos']
          print('tem_dado:', p['tem_dado'])
          print('anos:', p['anos'])
          print()
          print('=== Volume por ano x tipo ===')
          for ano in sorted(p['por_ano']):
              v = p['por_ano'][ano]
              print(f\"{ano}: total={v['total']} por_tipo={v['por_tipo']}\")
          print()
          print('=== Por módulo (agregado todos os anos) ===')
          from collections import Counter
          agg = Counter()
          for ano, v in p['por_modulo_ano'].items():
              for mod, e in v['modulos'].items():
                  agg[mod] += e['n']
              agg['(sem módulo)'] += v['sem_modulo']['n']
          for mod, n in agg.most_common():
              print(f'{mod}: {n}')
          print()
          print('=== Evolução mensal (últimos 6 meses com dado) ===')
          for m in p['mensal'][-6:]:
              print(f\"{m['mes']}: total={m['total']} por_tipo={m['por_tipo']}\")
          print()
          print('=== Ranking todos os tipos, por ano (top 10) ===')
          for ano in sorted(p['ranking_todos']):
              print(f'-- {ano} --')
              for r in p['ranking_todos'][ano][:10]:
                  print(f\"  {r['assignee']}: {r['n']}\")
          print()
          print('=== Ranking só Nova função, por ano (top 10) ===')
          for ano in sorted(p['ranking_nova_funcao']):
              print(f'-- {ano} --')
              for r in p['ranking_nova_funcao'][ano][:10]:
                  print(f\"  {r['assignee']}: {r['n']}\")
          print()
          print('=== Checagem Giovanna/Renato Canever fora do ranking ===')
          bad = []
          for ano, rs in p['ranking_todos'].items():
              for r in rs:
                  if r['assignee'] in ('Giovanna', 'Renato Canever'):
                      bad.append((ano, r))
          print('OK: nenhum encontrado no ranking' if not bad else f'FALHA: {bad}')
          print()
          print('=== Total geral de cards (todos os anos) ===')
          print(sum(v['total'] for v in p['por_ano'].values()), '== len(cards)?', len(p['cards']))
          print()
          print('=== Henry Américo em 2026 (cross-check com pergunta anterior da Jane) ===')
          henry_2026 = [k for k, c in p['cards'].items() if c['assignee']=='Henry Américo' and c['lancado_em'].startswith('2026')]
          print(sorted(henry_2026))
          "

      - name: Upload dash_data.json (produtos) como artifact
        uses: actions/upload-artifact@v4
        with:
          name: produtos-pem-dash-data
          path: dash_data.json
          retention-days: 5
