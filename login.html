<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · OrçaFascio</title><style>
:root{--navy:#04043A;--blue:#005FE8;--blueDark:#0046b3;--line:#e6e8ef;--muted:#6b7180;--text:#1a1c25}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;color:var(--text);
 background:radial-gradient(1200px 600px at 50% -10%,#fff,#f4f6fb 55%,#eef1f8);display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:400px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 30px 28px;box-shadow:0 12px 40px rgba(4,4,58,.08)}
.brand{display:flex;justify-content:center;margin-bottom:16px}.brand img{height:150px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);text-align:center;margin:0 0 8px}
h1{font-size:26px;font-weight:800;color:var(--navy);text-align:left;margin:0 0 6px}
.sub{font-size:12px;color:var(--muted);text-align:left;margin:0 0 20px;line-height:1.5}
label{display:block;font-size:12.5px;font-weight:600;color:var(--navy);margin:14px 0 6px}
input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--text);background:#fbfcfe;transition:border .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,95,232,.15);background:#fff}
.pw{position:relative;display:flex;align-items:center}.pw input{padding-right:80px}
.pw-toggle{position:absolute;right:10px;background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer}
.pw-toggle:hover{color:var(--blue)}
.row-between{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12px}
.chk{display:flex;align-items:center;gap:7px;margin:0;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.chk input{width:auto;margin:0;cursor:pointer}
.row-between a{color:var(--blue);text-decoration:none;font-weight:600}.row-between a:hover{text-decoration:underline}
.btn{width:100%;margin-top:20px;padding:12px 14px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--blueDark)}
.help{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
.help a{color:var(--blue);font-weight:600;text-decoration:none}.help a:hover{text-decoration:underline}
.msg{padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:16px;line-height:1.45;display:none}
.msg.err{background:#fdecee;border:1px solid #f6c6cd;color:#a51427;display:block}
.foot{margin-top:22px;text-align:center;font-size:11px;color:#9aa0b0}
